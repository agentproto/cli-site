name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Paper & Phosphor brand tokens are an identical copy in both
      # site repos (no shared package yet — the sites build standalone
      # in Docker). Fail fast when this copy drifts from the sibling's
      # main branch. Skips while the sibling doesn't have the file yet.
      - name: Brand tokens in sync with site
        run: |
          if curl -fsSL https://raw.githubusercontent.com/agentproto/site/main/src/app/brand.css -o /tmp/sibling-brand.css; then
            diff -u /tmp/sibling-brand.css src/app/brand.css
          else
            echo "sibling brand.css not found on site main — skipping"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      # `cache: pnpm` would speed up installs but requires a committed
      # pnpm-lock.yaml to compute its cache key. Skipping until we ship
      # a standalone lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No committed lockfile yet — the site is also a workspace member
      # of the private agentik-studio monorepo where the canonical
      # lockfile lives. CI resolves from package.json ranges.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # `prebuild` + `pretypecheck` both run scripts/sync-content.mjs
      # which clones github.com/agentproto/ts into .cache/ at depth 1.
      # Public repo — no auth needed.
      - name: Type-check
        run: pnpm typecheck

      - name: Build (with content sync)
        run: pnpm build
